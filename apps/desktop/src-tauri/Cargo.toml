[package]
name = "gitcat-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "gitcat_desktop_lib"
# GitCat currently ships as a desktop executable. Keeping this crate as an
# `rlib` avoids producing an unused Windows GNU DLL; PE DLLs are limited to
# 65,535 exports and the transitive Tauri/WebView2 graph exceeds that limit.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait.workspace = true
dunce.workspace = true
gitcat-contracts = { path = "../../../crates/gitcat-contracts" }
gitcat-core = { path = "../../../crates/gitcat-core" }
gitcat-forge = { path = "../../../crates/gitcat-forge" }
gitcat-git-cli = { path = "../../../crates/gitcat-git-cli" }
notify = "6"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2"
# The Explorer context menu launches GitCat with a folder; a second instance
# hands that folder to the running window instead of opening a rival one.
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
