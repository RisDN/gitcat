name: windows-release-build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release with the updater manifest
        type: boolean
        default: false
      release_notes:
        description: Release notes shown in the update prompt
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Verify MSVC target
        shell: pwsh
        run: |
          $hostLine = rustc -vV | Select-String '^host:'
          if ($hostLine -notmatch 'x86_64-pc-windows-msvc') {
            throw "Release must use x86_64-pc-windows-msvc; got $hostLine"
          }
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Verify frontend
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Build NSIS installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis
      - name: Verify WebView2 loader is self-contained
        shell: pwsh
        run: |
          $binary = Resolve-Path 'target\release\gitcat-desktop.exe'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw 'dumpbin.exe not found'
          }
          $dependencies = & $dumpbin /DEPENDENTS $binary
          if ($dependencies -match 'WebView2Loader\.dll') {
            throw 'gitcat-desktop.exe still imports WebView2Loader.dll'
          }
          if (Test-Path 'target\release\WebView2Loader.dll') {
            throw 'Unexpected dynamic WebView2Loader.dll in MSVC release output'
          }
          $installers = @(Get-ChildItem 'target\release\bundle\nsis\*-setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)"
          }
          Get-FileHash -Algorithm SHA256 $installers[0].FullName
      - name: Build updater manifest
        id: manifest
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $version = (Select-String -Path 'Cargo.toml' -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) {
            throw 'Could not read the workspace version from Cargo.toml'
          }
          $installer = Get-ChildItem 'target\release\bundle\nsis\*-setup.exe' | Select-Object -First 1
          $signatureFile = "$($installer.FullName).sig"
          if (-not (Test-Path $signatureFile)) {
            throw "Missing updater signature: $signatureFile. Is TAURI_SIGNING_PRIVATE_KEY set?"
          }
          $notes = $env:RELEASE_NOTES
          if (-not $notes) {
            $notes = "GitCat v$version"
          }
          $manifest = [ordered]@{
            version   = $version
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $signatureFile -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/v$version/$($installer.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 |
            Out-File 'target\release\bundle\nsis\latest.json' -Encoding utf8NoBOM
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer=$($installer.FullName)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: gitcat-windows-msvc
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/nsis/latest.json
            target/release/gitcat-desktop.exe
      - name: Publish GitHub release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $version = '${{ steps.manifest.outputs.version }}'
          $notes = $env:RELEASE_NOTES
          if (-not $notes) {
            $notes = "GitCat v$version"
          }
          gh release create "v$version" `
            --title "GitCat v$version" `
            --notes $notes `
            'target\release\bundle\nsis\latest.json' `
            "${{ steps.manifest.outputs.installer }}" `
            "${{ steps.manifest.outputs.installer }}.sig"
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE"
          }
